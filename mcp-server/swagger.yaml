openapi: 3.0.3
info:
  title: Spotify MCP Server API
  description: |
    REST API for Spotify MCP Server - Control Spotify playback, manage playlists,
    search music, and more from your React Native mobile app.

    ## Authentication
    This API uses OAuth 2.0 with Spotify. You need to:
    1. Register your app at [Spotify Developer Dashboard](https://developer.spotify.com/dashboard)
    2. Get `clientId` and `clientSecret`
    3. Complete OAuth flow to get `accessToken` and `refreshToken`

    ## Premium vs Free
    - **Premium Required**: Playback control (play, pause, skip, volume, seek)
    - **Free Allowed**: Search, get playlists, recently played, library management

  version: 1.0.0
  contact:
    name: Spotify MCP Server
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Authentication
    description: OAuth 2.0 authentication endpoints
  - name: Playback
    description: Control Spotify playback (Premium required)
  - name: Search
    description: Search for tracks, albums, artists, playlists
  - name: Playlists
    description: Manage playlists and tracks
  - name: Library
    description: User's saved tracks and albums
  - name: Albums
    description: Album information and tracks
  - name: Queue
    description: Playback queue management

paths:
  # ============ AUTHENTICATION ============
  /auth/login:
    get:
      tags:
        - Authentication
      summary: Initiate Spotify OAuth login
      description: Redirects user to Spotify authorization page
      responses:
        '302':
          description: Redirect to Spotify authorization URL

  /auth/callback:
    get:
      tags:
        - Authentication
      summary: OAuth callback endpoint
      description: Handles the callback from Spotify after user authorization
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Spotify
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State parameter for CSRF protection
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid authorization code or state mismatch

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Use refresh token to get a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The refresh token from initial authorization
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid refresh token

  # ============ PLAYBACK CONTROL ============
  /player/play:
    post:
      tags:
        - Playback
      summary: Start/Resume playback
      description: Start playing a track, album, artist, or playlist. Requires Spotify Premium.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  description: Spotify URI (e.g., spotify:track:4iV5W9uYEdYUVa79Axb7Rh)
                  example: "spotify:track:4iV5W9uYEdYUVa79Axb7Rh"
                type:
                  type: string
                  enum: [track, album, artist, playlist]
                  description: Type of item to play
                id:
                  type: string
                  description: Spotify ID of the item
                  example: "4iV5W9uYEdYUVa79Axb7Rh"
                deviceId:
                  type: string
                  description: Target device ID (optional)
      responses:
        '200':
          description: Playback started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Premium required for playback control
        '404':
          description: No active device found

  /player/pause:
    post:
      tags:
        - Playback
      summary: Pause playback
      description: Pause current playback. Requires Spotify Premium.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Target device ID (optional)
      responses:
        '200':
          description: Playback paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /player/resume:
    post:
      tags:
        - Playback
      summary: Resume playback
      description: Resume paused playback. Requires Spotify Premium.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Target device ID (optional)
      responses:
        '200':
          description: Playback resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /player/next:
    post:
      tags:
        - Playback
      summary: Skip to next track
      description: Skip to the next track in queue. Requires Spotify Premium.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
      responses:
        '200':
          description: Skipped to next track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /player/previous:
    post:
      tags:
        - Playback
      summary: Skip to previous track
      description: Skip to the previous track. Requires Spotify Premium.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
      responses:
        '200':
          description: Skipped to previous track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /player/volume:
    put:
      tags:
        - Playback
      summary: Set playback volume
      description: Set the volume for the current playback device. Requires Spotify Premium.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - volume_percent
              properties:
                volume_percent:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Volume level (0-100)
                  example: 50
                deviceId:
                  type: string
      responses:
        '200':
          description: Volume set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /player/seek:
    put:
      tags:
        - Playback
      summary: Seek to position
      description: Seek to a specific position in the currently playing track. Requires Spotify Premium.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - position_ms
              properties:
                position_ms:
                  type: integer
                  minimum: 0
                  description: Position in milliseconds
                  example: 60000
                deviceId:
                  type: string
      responses:
        '200':
          description: Seeked to position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /player/now-playing:
    get:
      tags:
        - Playback
      summary: Get currently playing track
      description: Get information about the currently playing track
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Currently playing track info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NowPlayingResponse'
        '204':
          description: Nothing is currently playing

  # ============ QUEUE ============
  /player/queue:
    get:
      tags:
        - Queue
      summary: Get playback queue
      description: Get the current playback queue
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum number of upcoming items to show
      responses:
        '200':
          description: Queue retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'

    post:
      tags:
        - Queue
      summary: Add item to queue
      description: Add a track, album, artist or playlist to the playback queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uri:
                  type: string
                  description: Spotify URI
                type:
                  type: string
                  enum: [track, album, artist, playlist]
                id:
                  type: string
                  description: Spotify ID
                deviceId:
                  type: string
      responses:
        '200':
          description: Item added to queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============ SEARCH ============
  /search:
    get:
      tags:
        - Search
      summary: Search Spotify
      description: Search for tracks, albums, artists, or playlists
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search query
          example: "Arijit Singh"
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [track, album, artist, playlist]
          description: Type of item to search for
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum number of results
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  # ============ PLAYLISTS ============
  /playlists:
    get:
      tags:
        - Playlists
      summary: Get user's playlists
      description: Get a list of the current user's playlists
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
          description: Maximum number of playlists to return
      responses:
        '200':
          description: User's playlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistsResponse'

    post:
      tags:
        - Playlists
      summary: Create a new playlist
      description: Create a new playlist for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the playlist
                  example: "My Awesome Playlist"
                description:
                  type: string
                  description: Description of the playlist
                public:
                  type: boolean
                  default: false
                  description: Whether the playlist should be public
      responses:
        '201':
          description: Playlist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistCreatedResponse'

  /playlists/{playlistId}/tracks:
    get:
      tags:
        - Playlists
      summary: Get playlist tracks
      description: Get a list of tracks in a playlist
      security:
        - bearerAuth: []
      parameters:
        - name: playlistId
          in: path
          required: true
          schema:
            type: string
          description: Spotify playlist ID
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: Playlist tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistTracksResponse'

    post:
      tags:
        - Playlists
      summary: Add tracks to playlist
      description: Add one or more tracks to a playlist
      security:
        - bearerAuth: []
      parameters:
        - name: playlistId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trackIds
              properties:
                trackIds:
                  type: array
                  items:
                    type: string
                  description: Array of Spotify track IDs
                  example: ["4iV5W9uYEdYUVa79Axb7Rh", "1301WleyT98MSxVHPZCA6M"]
                position:
                  type: integer
                  minimum: 0
                  description: Position to insert tracks (0-based)
      responses:
        '200':
          description: Tracks added to playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============ LIBRARY ============
  /me/tracks:
    get:
      tags:
        - Library
      summary: Get user's saved tracks
      description: Get tracks saved in the user's "Liked Songs" library
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Saved tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedTracksResponse'

  /me/recently-played:
    get:
      tags:
        - Library
      summary: Get recently played tracks
      description: Get a list of recently played tracks
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Recently played tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentlyPlayedResponse'

  # ============ ALBUMS ============
  /albums/{albumId}:
    get:
      tags:
        - Albums
      summary: Get album details
      description: Get detailed information about an album
      security:
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
          description: Spotify album ID
      responses:
        '200':
          description: Album details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumResponse'

  /albums:
    get:
      tags:
        - Albums
      summary: Get multiple albums
      description: Get details for multiple albums by their IDs
      security:
        - bearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated list of album IDs (max 20)
          example: "382ObEPsp2rxGrnsizN5TX,1A2GTWGtFfWp7KSQTwWOyo"
      responses:
        '200':
          description: Multiple albums
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumsResponse'

  /albums/{albumId}/tracks:
    get:
      tags:
        - Albums
      summary: Get album tracks
      description: Get tracks from a specific album
      security:
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Album tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumTracksResponse'

  /me/albums:
    get:
      tags:
        - Albums
      summary: Check saved albums
      description: Check if albums are saved in user's library
      security:
        - bearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated album IDs to check
      responses:
        '200':
          description: Save status for each album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumsSavedResponse'

    put:
      tags:
        - Albums
      summary: Save albums to library
      description: Save one or more albums to user's library
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - albumIds
              properties:
                albumIds:
                  type: array
                  items:
                    type: string
                  maxItems: 20
      responses:
        '200':
          description: Albums saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

    delete:
      tags:
        - Albums
      summary: Remove albums from library
      description: Remove one or more albums from user's library
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - albumIds
              properties:
                albumIds:
                  type: array
                  items:
                    type: string
                  maxItems: 20
      responses:
        '200':
          description: Albums removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Spotify OAuth access token

  schemas:
    # ============ COMMON ============
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Something went wrong"
        code:
          type: string
          example: "INVALID_TOKEN"

    # ============ AUTH ============
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Token expiry time in seconds
          example: 3600

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          example: 3600

    # ============ TRACK ============
    Track:
      type: object
      properties:
        id:
          type: string
          example: "4iV5W9uYEdYUVa79Axb7Rh"
        name:
          type: string
          example: "Tum Hi Ho"
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
        album:
          $ref: '#/components/schemas/AlbumSimplified'
        duration_ms:
          type: integer
          example: 261000
        duration_formatted:
          type: string
          example: "4:21"
        uri:
          type: string
          example: "spotify:track:4iV5W9uYEdYUVa79Axb7Rh"
        external_urls:
          type: object
          properties:
            spotify:
              type: string

    # ============ ARTIST ============
    Artist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "Arijit Singh"
        uri:
          type: string

    # ============ ALBUM ============
    AlbumSimplified:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'

    Album:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
        release_date:
          type: string
          example: "2013-04-26"
        total_tracks:
          type: integer
        album_type:
          type: string
          enum: [album, single, compilation]
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        uri:
          type: string

    AlbumResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Album'

    AlbumsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Album'

    AlbumTracksResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Track'
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer

    AlbumsSavedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              isSaved:
                type: boolean

    # ============ IMAGE ============
    Image:
      type: object
      properties:
        url:
          type: string
        height:
          type: integer
        width:
          type: integer

    # ============ PLAYLIST ============
    Playlist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: object
          properties:
            id:
              type: string
            display_name:
              type: string
        tracks:
          type: object
          properties:
            total:
              type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        public:
          type: boolean
        uri:
          type: string

    PlaylistsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Playlist'
            total:
              type: integer

    PlaylistCreatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            uri:
              type: string

    PlaylistTracksResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  track:
                    $ref: '#/components/schemas/Track'
                  added_at:
                    type: string
                    format: date-time
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer

    # ============ NOW PLAYING ============
    NowPlayingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            is_playing:
              type: boolean
            track:
              $ref: '#/components/schemas/Track'
            progress_ms:
              type: integer
            progress_formatted:
              type: string
              example: "1:30"
            device:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                volume_percent:
                  type: integer

    # ============ QUEUE ============
    QueueResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            currently_playing:
              $ref: '#/components/schemas/Track'
            queue:
              type: array
              items:
                $ref: '#/components/schemas/Track'

    # ============ SEARCH ============
    SearchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            tracks:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Track'
                total:
                  type: integer
            albums:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Album'
                total:
                  type: integer
            artists:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Artist'
                total:
                  type: integer
            playlists:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Playlist'
                total:
                  type: integer

    # ============ SAVED TRACKS ============
    SavedTracksResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  track:
                    $ref: '#/components/schemas/Track'
                  added_at:
                    type: string
                    format: date-time
